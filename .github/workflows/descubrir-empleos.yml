name: Descubrir páginas de empleo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scraper/empresas.json', 'scraper/descubrir.mjs']
permissions:
  contents: write
concurrency: { group: scraper, cancel-in-progress: false }
jobs:
  descubrir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scraper/descubrir.mjs
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add scraper/fuentes.json scraper/informe.md
          git diff --cached --quiet || git commit -m "Actualizar páginas de empleo encontradas"
          git pull --rebase origin main && git push

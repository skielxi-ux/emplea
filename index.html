<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Contanos qué buscás y en qué provincia: te mostramos las vacantes de consultoras y empresas y te postulás con tu CV en segundos.">

  <!-- Tipografía (estilo Meta: sans geométrica-humanista, pesos fuertes en títulos) -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Tailwind CSS (Play CDN para el prototipo; ver README para build de producción) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#3B5BFD', dark: '#2A44D6', soft: '#ECEEFF' },
            ink: { DEFAULT: '#14123A', soft: '#4A4868', mute: '#64627C' },
            surface: '#F6F5FB',
            line: '#E3E1EF',
            lilac: '#E7E3FF',
            peach: { DEFAULT: '#FFE9DB', line: '#FFD3B8' },
            sun: { DEFAULT: '#FFC93C', soft: '#FFF3CF' },
            mint: '#D8F3E6',
            ok: '#11946A',
            warn: '#8F5B0F',
            bad: '#D9415E'
          },
          fontFamily: {
            sans: ['Figtree', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
            display: ['"Bricolage Grotesque"', 'Figtree', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            card: '0 1px 0 rgba(20,18,58,.04), 0 10px 28px -18px rgba(20,18,58,.28)',
            lift: '0 22px 44px -20px rgba(59,91,253,.45)'
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-full font-semibold h-12 px-6 text-base transition active:scale-[.98] disabled:opacity-50 disabled:pointer-events-none select-none whitespace-nowrap; }
      .btn-primary { @apply bg-brand text-white hover:bg-brand-dark; }
      .btn-outline { @apply bg-white text-ink border border-line hover:bg-surface; }
      .btn-soft { @apply bg-brand-soft text-brand hover:bg-[#d8e7ff]; }
      .btn-sm { @apply h-10 px-4 text-[0.95rem]; }
      .chip { @apply inline-flex items-center gap-1.5 h-10 px-4 rounded-full border border-line bg-white text-ink font-semibold text-[0.95rem] whitespace-nowrap transition hover:border-brand hover:text-brand; }
      .chip-on { @apply bg-ink text-white border-ink hover:text-white; }
      .card { @apply bg-white rounded-[22px] border border-line shadow-card; }
      .input { @apply w-full h-12 rounded-2xl border border-line bg-white px-4 text-base text-ink placeholder:text-ink-mute/80 outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15; }
      .label { @apply block font-semibold mb-2; }
      .icon-btn { @apply w-11 h-11 shrink-0 grid place-items-center rounded-full hover:bg-surface transition text-ink-soft; }
      .err { @apply text-bad text-[0.95rem] mt-2 font-medium; }
    }
  </style>
  <link rel="stylesheet" href="assets/css/styles.css?v=20261029a">
</head>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- App -->
